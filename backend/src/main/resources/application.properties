spring.application.name=taller-security-api
spring.config.import=optional:file:./.env[.properties],optional:file:./application-local.properties
server.port=${SERVER_PORT:8080}
server.error.include-message=never

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.security.cookie-secure=${COOKIE_SECURE:false}
app.security.development-mode=${DEVELOPMENT_MODE:true}
app.security.initial-admin-name=${INITIAL_ADMIN_NAME}
app.security.initial-admin-email=${INITIAL_ADMIN_EMAIL}
app.security.initial-admin-password=${INITIAL_ADMIN_PASSWORD}
app.security.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
